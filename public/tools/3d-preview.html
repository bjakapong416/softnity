<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#14234a; --navy2:#0c1530; --gold:#e8c170; --gold2:#fff1c4; --ink:#eef3ff; --muted:#a9b6d8; }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{ height:100%; margin:0; background:#9fd0ef; overflow:hidden; font-family:"Chakra Petch",system-ui,sans-serif; color:var(--ink); }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud{ position:fixed; z-index:2; pointer-events:none; }
  .hud > *{ pointer-events:auto; }
  #top{ top:10px; left:50%; transform:translateX(-50%); text-align:center; }
  #mapName{ font:700 18px "Cinzel","Chakra Petch",serif; color:#fff; text-shadow:0 1px 0 #000,0 0 8px rgba(0,0,0,.6); display:flex; align-items:center; gap:10px; justify-content:center; pointer-events:none; }
  #mapName::before,#mapName::after{ content:""; width:40px; height:2px; background:linear-gradient(90deg,transparent,#fff); }
  #mapName::after{ background:linear-gradient(90deg,#fff,transparent); }
  #card{ top:12px; left:12px; display:flex; gap:10px; align-items:flex-start; }
  #portrait{ width:76px; height:76px; border-radius:14px; background:radial-gradient(circle at 50% 35%,#fff3d6,#f0c890 60%,#c9864a); box-shadow:0 0 0 2px #fff4d6,0 0 0 4px #8a5a2b,0 6px 14px rgba(0,0,0,.35); overflow:hidden; }
  #portrait canvas{ width:100%; height:100%; display:block; }
  .who b{ display:block; font-size:16px; text-shadow:0 1px 0 #000,0 0 5px rgba(0,0,0,.7); }
  .who small{ color:#cfe6ff; font-weight:700; text-shadow:0 1px 0 #000; }
  .bar{ width:170px; height:12px; border-radius:7px; background:#0b1330; border:1px solid #6b5a2a; margin-top:5px; overflow:hidden; position:relative; }
  .bar i{ position:absolute; inset:0 auto 0 0; width:100%; background:linear-gradient(#ff8a7a,#d8342c); transition:width .25s; }
  .bar.sp i{ background:linear-gradient(#8fc0ff,#3d7bf0); }
  .bar i::after{ content:""; position:absolute; left:2px; right:2px; top:1px; height:40%; border-radius:5px; background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0)); }
  #dock{ bottom:18px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; }
  #dps{ font:italic 700 17px "Chakra Petch"; padding:2px 18px 2px 12px; background:linear-gradient(90deg,rgba(120,70,200,.85),rgba(120,70,200,0)); border-radius:4px; text-shadow:0 1px 0 #3a1a6a; opacity:0; transition:opacity .3s; pointer-events:none; }
  #auto{ font:italic 700 15px "Chakra Petch"; color:#fff; text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.7); pointer-events:none; }
  #auto.on{ color:#c9ff9a; }
  .row{ display:flex; gap:10px; align-items:flex-end; }
  .sk{ position:relative; width:64px; height:64px; border-radius:14px; border:2px solid #fff; cursor:pointer; background:linear-gradient(180deg,#f4f7ff,#c9d4ea); box-shadow:0 0 0 2px #5a6a8e,0 5px 10px rgba(0,0,0,.3); display:grid; place-items:center; font:700 26px "Chakra Petch"; color:#2c3f7a; }
  .sk span{ position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); white-space:nowrap; font:700 11.5px "Chakra Petch"; color:#fff; text-shadow:0 1px 0 #000,0 0 3px #000; }
  .sk.round{ border-radius:50%; background:radial-gradient(circle at 35% 30%,#9fd0ff,#2c55b0 70%); color:#fff; }
  .sk.round.on{ background:radial-gradient(circle at 35% 30%,#c9ffb0,#2fa860 70%); box-shadow:0 0 0 2px #1f7a40,0 0 22px rgba(120,255,140,.8); }
  .sk:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }
  #tip{ bottom:14px; right:14px; max-width:260px; font-size:12.5px; line-height:1.5; color:#fff; text-shadow:0 1px 0 #000,0 0 4px rgba(0,0,0,.8); text-align:right; }
  #badge{ top:12px; right:12px; font:700 13px "Chakra Petch"; color:#fff; background:linear-gradient(180deg,rgba(40,64,120,.9),rgba(12,21,48,.9)); border:1px solid rgba(232,193,112,.8); border-radius:10px; padding:7px 12px; cursor:pointer; }
  #hint{ bottom:120px; left:50%; transform:translateX(-10%); display:flex; align-items:center; gap:0; cursor:pointer; }
  #hint canvas{ width:78px; height:78px; margin-right:-18px; position:relative; z-index:1; filter:drop-shadow(0 4px 2px rgba(0,0,0,.2)); }
  #hint .hb{ background:linear-gradient(180deg,#fffaf3,#ffeef2); border:2px solid #ffc6d8; border-radius:16px; padding:8px 14px 8px 24px; color:#b0506e; font:700 13.5px/1.45 "Chakra Petch"; box-shadow:0 4px 10px rgba(0,0,0,.18); }
  #hint .hb label{ display:flex; gap:6px; align-items:center; color:#8a6a78; font-weight:600; font-size:12px; margin-top:3px; }
  #quest{ bottom:108px; left:calc(50% - 330px); display:flex; align-items:center; gap:8px; padding:5px 18px 5px 6px; background:linear-gradient(90deg,rgba(40,28,10,.72),rgba(40,28,10,0)); border-radius:8px; }
  #quest .qi{ width:30px; height:30px; border-radius:6px; background:linear-gradient(180deg,#fff3d6,#e8c170); box-shadow:0 0 0 2px #8a6a2a; display:grid; place-items:center; color:#6b4a10; font-weight:800; }
  #quest b{ display:block; color:#ffe38a; font-size:13px; text-shadow:0 1px 0 #000; } #quest small{ color:#fff; font-size:12.5px; text-shadow:0 1px 0 #000; }
  @media (max-width:760px){ #quest{ left:10px; bottom:130px; } #hint{ left:10px; transform:none; bottom:190px; } }
  .dmg{ position:fixed; z-index:3; pointer-events:none; font:italic 800 26px "Chakra Petch"; color:#ffd24a; -webkit-text-stroke:1.5px #6b2a08; text-shadow:0 3px 0 #6b2a08; transform:translate(-50%,-50%); animation:dmg .9s ease-out forwards; }
  .dmg.crit{ font-size:36px; color:#ff8a3d; }
  .dmg.hurt{ color:#ff6b6b; -webkit-text-stroke-color:#3a0a0a; text-shadow:0 3px 0 #3a0a0a; font-size:22px; }
  @keyframes dmg{ 0%{ opacity:0; transform:translate(-50%,-30%) scale(.6); } 15%{ opacity:1; transform:translate(-50%,-60%) scale(1.15); } 100%{ opacity:0; transform:translate(-50%,-190%) scale(1); } }
  #loading{ position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:radial-gradient(120% 90% at 50% 20%,#23407e,#0c1530 70%); transition:opacity .6s; }
  #loading b{ font:700 clamp(34px,6vw,64px) "Cinzel",serif; letter-spacing:5px; background:linear-gradient(180deg,#fffbe6,#ffe08a 45%,#c8862a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #loading small{ display:block; text-align:center; color:#cfd8f5; margin-top:8px; }
  @media (max-width:640px){ #tip{ display:none; } .bar{ width:120px; } #portrait{ width:60px; height:60px; } #badge{ display:none; } }
  @media (prefers-reduced-motion:reduce){ .dmg{ animation-duration:.01s; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>

<body>
<canvas id="c" aria-label="ฉาก 3D ของ Softnity"></canvas>
<div id="loading"><div><b>SOFTNITY</b><small>กำลังสร้างโลก 3D…</small></div></div>

<div class="hud" id="top"><div id="mapName">Everhaven Fields</div></div>
<div class="hud" id="card">
  <div id="portrait"></div>
  <div class="who"><b id="pname">Jakapong</b><small>Novice · Lv 12</small>
    <div class="bar"><i id="hp"></i></div><div class="bar sp"><i style="width:80%"></i></div></div>
</div>
<button class="hud" id="badge">ไปทะเลทราย Sunscar</button>
<div class="hud" id="dock">
  <div id="dps"></div>
  <div id="auto">คลิกพื้นเพื่อเดิน · คลิกมอนสเตอร์เพื่อโจมตี</div>
  <div class="row">
    <button class="sk" id="btnAtk" aria-label="โจมตีตัวที่ใกล้ที่สุด (Space)">⚔<span>โจมตีปกติ</span></button>
    <button class="sk round" id="btnAuto" aria-label="เปิดหรือปิดออโต้ (B)">A<span>ออโต้</span></button>
  </div>
</div>
<div class="hud" id="quest"><span class="qi">!</span><span><b id="qT">ภารกิจมอนสเตอร์</b><small id="qD"></small></span></div>
<div class="hud" id="hint"><canvas id="hintJel" width="160" height="160"></canvas><div class="hb">ตอนนี้ต่อสู้แบบควบคุมเอง<br>แตะเพื่อเปิดออโต้<label><input type="checkbox" id="hintOff"> ไม่ต้องแสดงอีกวันนี้</label></div></div>
<div class="hud" id="tip">ลากเมาส์ขวาหรือใช้ล้อเมาส์เพื่อซูม · WASD เดิน · Space โจมตี · B ออโต้</div>

<script type="module">
import * as THREE from 'three';

/* ---------------- biome ---------------- */
let BIOME='meadow'; try{ BIOME=localStorage.getItem('softnity-biome')||'meadow'; }catch(e){}
const DESERT=BIOME==='desert';
document.getElementById('badge').textContent=DESERT?'ไปทุ่งหญ้า Everhaven':'ไปทะเลทราย Sunscar';
document.getElementById('badge').onclick=()=>{ try{ localStorage.setItem('softnity-biome',DESERT?'meadow':'desert'); }catch(e){} location.reload(); };
document.getElementById('mapName').textContent=DESERT?'Sunscar Canyon':'Everhaven Fields';

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const SKY=DESERT?0xf5ddb0:0xbfe4f7; scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 36, 74);

const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.5, 200);
let zoom = 1;

const hemi = DESERT? new THREE.HemisphereLight(0xfff1d8, 0xb88a52, 1.05) : new THREE.HemisphereLight(0xdff2ff, 0x5b7a3a, 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight(DESERT?0xffe2b4:0xfff0d6, DESERT?2.6:2.3);
sun.position.set(-14, 26, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-26, right:26, top:26, bottom:-26, near:1, far:80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ---------------- helpers ---------------- */
const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function hash(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ let s=0, a=.5, f=1; for(let i=0;i<4;i++){ s+=a*vnoise(x*f,y*f); f*=2; a*=.5; } return s; }
// a winding dirt road through the field
const roadZ = x => Math.sin(x*0.09)*6 + Math.sin(x*0.031+1.3)*4;
const POND = { x:-17, z:13, r:7 };
function roadDist(x,z){ return Math.abs(z - roadZ(x)); }
function groundY(x,z){
  let h = (fbm(x*0.045+10, z*0.045+3)-0.5)*(DESERT?3.6:2.6);
  const rd = roadDist(x,z); h *= clamp((rd-2)/6,0.25,1);
  const pd = Math.hypot(x-POND.x, z-POND.z); if(pd<POND.r+3){ const t=clamp((pd-POND.r+1.5)/4,0,1); h = h*t - (1-t)*1.1; }
  return h;
}
const toon = (() => { const d=new Uint8Array([90,90,90,255, 170,170,170,255, 255,255,255,255]); const t=new THREE.DataTexture(d,3,1); t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t; })();
const M = {
  toon: c => new THREE.MeshToonMaterial({ color:c, gradientMap:toon }),
  std: (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:.85 }, o)),
  flat: (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:.9, flatShading:true }, o)),
};
const outlineMat = new THREE.MeshBasicMaterial({ color:0x2a1a14, side:THREE.BackSide });
function outlined(mesh, k=1.06){ const o=new THREE.Mesh(mesh.geometry, outlineMat); o.scale.setScalar(k); mesh.add(o); return mesh; }
function shadowed(o){ o.traverse(m=>{ if(m.isMesh && m.material!==outlineMat){ m.castShadow=true; m.receiveShadow=true; } }); return o; }

/* ---------------- terrain ---------------- */
const SIZE=120, SEG=DESERT?240:180;
const tg = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); tg.rotateX(-Math.PI/2);
const pos = tg.attributes.position, cols = new Float32Array(pos.count*3);
const cSandA=new THREE.Color(0xeccb8e), cSandB=new THREE.Color(0xf8e2b2), cSandC=new THREE.Color(0xd3a462), cSandD=new THREE.Color(0xe2bb7c), cWet=new THREE.Color(0xc79a5c);
const cGrassA=new THREE.Color(0x6fb24a), cGrassB=new THREE.Color(0x9ccd5c), cGrassC=new THREE.Color(0x4f9438), cDirt=new THREE.Color(0xdcbf8c), cDirt2=new THREE.Color(0xc4a270), cSand=new THREE.Color(0xe9d7a6), tmp=new THREE.Color();
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), z=pos.getZ(i); pos.setY(i, groundY(x,z));
  const n=fbm(x*0.12,z*0.12), n2=fbm(x*0.5+40,z*0.5);
  tmp.copy(cGrassA).lerp(cGrassB, clamp(n*1.4-0.3,0,1)).lerp(cGrassC, clamp((0.45-n2)*2,0,.6)); tmp.multiplyScalar(.92+hash(x*3.1,z*2.7)*.12);
  const rd=roadDist(x,z)+ (n2-0.5)*1.6; const road=clamp((3.2-rd)/1.4,0,1);
  const dirt=cDirt.clone().lerp(cDirt2, n2); tmp.lerp(dirt, road);
  const pd=Math.hypot(x-POND.x,z-POND.z); tmp.lerp(cSand, clamp((POND.r+2.2-pd)/1.6,0,1)*(pd>POND.r-1?1:0));
  if(DESERT){ // wind-carved sand ripples + darker swirl streaks
    const warp=fbm(x*0.045+7,z*0.045-3)*7, ph=x*0.62+z*0.28+warp*2.3, rip=Math.sin(ph), line=Math.pow(Math.max(0,Math.sin(ph-0.55)),14), streak=Math.sin(x*0.1-z*0.06+warp*.9);
    tmp.copy(cSandA).lerp(cSandB, clamp(rip*.5+.5,0,1)*.85).lerp(cSandC, line*.75).lerp(cSandC, clamp((n-.52)*2.6,0,.5)).lerp(cSandC, clamp(streak-.4,0,.6)*.7);
    tmp.lerp(cSandD, road*.35); tmp.multiplyScalar(.96+hash(x*4.1,z*3.7)*.07);
    const pd2=Math.hypot(x-POND.x,z-POND.z); tmp.lerp(cWet, clamp((POND.r+1.4-pd2)/1.2,0,1)); }
  cols.set([tmp.r,tmp.g,tmp.b], i*3);
}
tg.setAttribute('color', new THREE.BufferAttribute(cols,3)); tg.computeVertexNormals();
const terrain = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.95 }));
terrain.receiveShadow = true; scene.add(terrain);

// pond
const water = new THREE.Mesh(new THREE.CircleGeometry(POND.r+0.8, 64).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color:DESERT?0x2fc2c8:0x3aa8e6, roughness:.06, metalness:.25, transparent:true, opacity:.93, emissive:0x0b3a66, emissiveIntensity:.35 }));
water.position.set(POND.x, -0.42, POND.z); water.receiveShadow=true; scene.add(water);
const ripples=[]; for(let i=0;i<3;i++){ const r=new THREE.Mesh(new THREE.RingGeometry(.4,.48,40).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.5 })); r.position.set(POND.x+rnd(-3,3),-0.38,POND.z+rnd(-3,3)); r.userData.t=i*1.1; scene.add(r); ripples.push(r); }
// lily pads
for(let i=0;i<9;i++){ const a=rnd(0,6.28), d=rnd(1,POND.r-1); const l=new THREE.Mesh(new THREE.CircleGeometry(rnd(.35,.55),16,0.3,5.9).rotateX(-Math.PI/2), M.std(0x5fae4a)); l.position.set(POND.x+Math.cos(a)*d,-0.39,POND.z+Math.sin(a)*d); l.rotation.y=rnd(0,6); scene.add(l);
  if(i%3===0){ const f=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8), M.toon(0xffb6d0)); f.position.set(l.position.x,-0.3,l.position.z); scene.add(f); } }

/* ---------------- props ---------------- */
const blocked=[]; // simple circle colliders {x,z,r}
function placeOK(x,z,r){ return roadDist(x,z)>3.6+r && Math.hypot(x-POND.x,z-POND.z)>POND.r+2+r && Math.abs(x)<SIZE/2-4 && Math.abs(z)<SIZE/2-4 && !blocked.some(b=>Math.hypot(b.x-x,b.z-z)<b.r+r); }
const occluders=[];
function addAt(obj,x,z,r){ obj.position.set(x, groundY(x,z), z); scene.add(obj); if(r) blocked.push({x,z,r}); if(r>=1.4||obj.userData.occ) occluders.push(obj); return obj; }

function roundTree(kind){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.34,1.8,8), M.flat(0x8a5a32)); trunk.position.y=.9; g.add(trunk);
  const pal={ green:[0x4f9a3c,0x62ad48,0x3f8a34], bloom:[0x5aa648,0x6cb652,0x4f9a3c], autumn:[0xe08a2c,0xf0a83a,0xc86a22] }[kind];
  const blobs=[[0,2.5,0,1.25],[.8,2.2,.3,.9],[-.75,2.25,-.2,.95],[.1,3.2,-.1,.85],[-.2,2.1,.8,.8]];
  blobs.forEach(([x,y,z,r],i)=>{ const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1), M.flat(pal[i%3])); m.position.set(x,y,z); m.rotation.set(rnd(0,3),rnd(0,3),0); g.add(m); });
  if(kind==='bloom'){ for(let i=0;i<26;i++){ const a=rnd(0,6.28), b=rnd(.2,1.4); const p=new THREE.Mesh(new THREE.IcosahedronGeometry(.11,0), M.std(i%3?0xffb6d0:0xfff0f6,{ roughness:.6 })); p.position.set(Math.cos(a)*1.15*Math.sin(b), 2.5+Math.cos(b)*1.1, Math.sin(a)*1.15*Math.sin(b)); g.add(p); } }
  g.scale.setScalar(rnd(.9,1.25)); return shadowed(g);
}
function pineTree(){
  const g=new THREE.Group(); const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,1.2,7), M.flat(0x6b4424)); trunk.position.y=.6; g.add(trunk);
  [[1.3,1.6,1.3],[1.0,1.4,2.2],[.7,1.2,3.0]].forEach(([r,h,y],i)=>{ const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,8), M.flat([0x2f6e4a,0x3a7d52,0x468c5a][i])); c.position.y=y; c.rotation.y=rnd(0,1); g.add(c); });
  g.scale.setScalar(rnd(1,1.4)); return shadowed(g);
}
function rock(){ const m=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.4,.8),0), M.flat(0x9aa0a8)); m.scale.set(1,rnd(.55,.8),rnd(.8,1.2)); m.rotation.y=rnd(0,6); m.position.y=.15; const g=new THREE.Group(); g.add(m); return shadowed(g); }
function house(roofCol){
  const g=new THREE.Group(), W=4.2, D=3.4;
  const base=new THREE.Mesh(new THREE.BoxGeometry(W+.3,.5,D+.3), M.flat(0xa9a296)); base.position.y=.25; g.add(base);
  const wall=new THREE.Mesh(new THREE.BoxGeometry(W,2.2,D), M.std(0xf2e4c4)); wall.position.y=1.6; g.add(wall);
  const beam=M.std(0x6b4424); [[-W/2,0],[W/2,0],[0,0]].forEach(([x])=>{ const b=new THREE.Mesh(new THREE.BoxGeometry(.18,2.2,.1),beam); b.position.set(x*0.98,1.6,D/2+.04); g.add(b); });
  const hb=new THREE.Mesh(new THREE.BoxGeometry(W,.16,.1),beam); hb.position.set(0,2.2,D/2+.04); g.add(hb);
  const shape=new THREE.Shape(); shape.moveTo(-W/2-.45,0); shape.lineTo(0,1.9); shape.lineTo(W/2+.45,0); shape.lineTo(-W/2-.45,0);
  const roof=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{ depth:D+.8, bevelEnabled:false }), M.std(roofCol,{ roughness:.7 })); roof.position.set(0,2.7,-D/2-.4); g.add(roof);
  const dark=new THREE.Color(roofCol).multiplyScalar(.72).getHex();

const S={ move:null, target:null, atkAt:0, swing:0, auto:false, hp:100, keys:{}, dmgLog:[] };
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(ev){ const r=canvas.getBoundingClientRect(); mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(mobs.filter(m=>!m.userData.dead),true); if(hits.length){ let o=hits[0].object; while(o&&!mobs.includes(o)) o=o.parent; if(o){ S.target=o; S.move=null; return; } }
  const g=ray.intersectObject(terrain); if(g.length){ S.move=g[0].point.clone(); S.target=null; marker.position.copy(S.move).add(new THREE.Vector3(0,.05,0)); marker.material.opacity=1; marker.scale.setScalar(1); } }
canvas.addEventListener('pointerdown',e=>{ if(e.button===0) pick(e); });

function nearest(){ let best=null,bd=1e9; mobs.forEach(m=>{ if(m.userData.dead) return; const d=m.position.distanceTo(hero.position); if(d<bd){ bd=d; best=m; } }); return best; }

  const top=m.position.clone().add(new THREE.Vector3(0,m.userData.fly?2.2:(m.userData.tall?m.userData.tall-.4:1.3),0)); dmgText(top,dmg,crit?'crit':''); burst(top.clone().add(new THREE.Vector3(0,-.4,0)), crit?0xffb040:0xfff0c0, crit?14:7, 2.2);

  if(m.userData.hp<=0){ m.userData.dead=true; S.target=null; ring.visible=false; burst(m.position.clone().add(new THREE.Vector3(0,.6,0)), {moth:0xc9b0ff,scorpion:0xffb070,golem:0xd9a57a,boss:0xffe08a}[m.userData.kind]||0xff8fb8, 22, 3.5); questKill(m.userData.kind);

/* ---------------- loop ---------------- */
const clock=new THREE.Clock(); const camPos=new THREE.Vector3(); const look=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime; windU.value=t;
  const U=hero.userData;
  // auto battle
  if(S.auto && !S.target && !S.move){ const m=nearest(); if(m && m.position.distanceTo(hero.position)<26) S.target=m; }
  // keyboard move
  const kx=(S.keys.KeyD||S.keys.ArrowRight?1:0)-(S.keys.KeyA||S.keys.ArrowLeft?1:0), kz=(S.keys.KeyS||S.keys.ArrowDown?1:0)-(S.keys.KeyW||S.keys.ArrowUp?1:0);
  let goal=null; if(kx||kz){ goal=hero.position.clone().add(new THREE.Vector3(kx,0,kz).normalize().multiplyScalar(2)); S.move=null; S.target=null; }
  else if(S.target && !S.target.userData.dead){ const d=S.target.position.distanceTo(hero.position); if(d>1.7) goal=S.target.position.clone(); else if(t>S.atkAt){ S.atkAt=t+.75; S.swing=1; setTimeout(()=>{ if(S.target&&!S.target.userData.dead) hitMob(S.target); },160); } }
  else if(S.move){ goal=S.move; if(hero.position.distanceTo(S.move)<.25) S.move=null; }
  let moving=false;
  if(goal){ const dir=goal.clone().sub(hero.position); dir.y=0; const d=dir.length(); if(d>.05){ dir.normalize(); const step=Math.min(d,5.2*dt);
      const nx=hero.position.x+dir.x*step, nz=hero.position.z+dir.z*step; if(Math.hypot(nx-POND.x,nz-POND.z)>POND.r-.3){ hero.position.x=nx; hero.position.z=nz; moving=true; }
      const ang=Math.atan2(dir.x,dir.z); let da=ang-hero.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); hero.rotation.y+=da*Math.min(1,dt*12); } }
  else if(S.target&&!S.target.userData.dead){ const dir=S.target.position.clone().sub(hero.position); const ang=Math.atan2(dir.x,dir.z); let da=ang-hero.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); hero.rotation.y+=da*Math.min(1,dt*12); }
  hero.position.y=groundY(hero.position.x,hero.position.z);
  // hero animation
  const w=moving?Math.sin(t*11):0;
  U.legL.rotation.x=w*.7; U.legR.rotation.x=-w*.7; U.armL.rotation.x=-w*.6;
  U.body.position.y=moving?Math.abs(Math.sin(t*11))*.07:Math.sin(t*2.4)*.018;
  U.head.rotation.z=Math.sin(t*1.7)*.03;
  if(S.swing>0){ S.swing=Math.max(0,S.swing-dt*3.2); const k=1-S.swing; U.armR.rotation.x=-2.4+k*3.1; U.armR.rotation.z=-.3+k*.3;
    slash.material.opacity=Math.max(0,.9-k)*.9; slash.position.copy(hero.position).add(new THREE.Vector3(0,1.05,0)); slash.rotation.set(-Math.PI/2+.3, 0, -hero.rotation.y+Math.PI*.1-k*1.2); }
  else { U.armR.rotation.x=w*.6; U.armR.rotation.z=0; slash.material.opacity=0; }
  heroName.position.copy(hero.position).add(new THREE.Vector3(0,-.25,0)); shadowDisc.position.set(hero.position.x,hero.position.y+.03,hero.position.z);
  // monsters
  mobs.forEach(m=>{ const u=m.userData;
    if(u.dead){ u.deadT+=dt; u.body.scale.set(1+u.deadT*1.5,Math.max(.02,1-u.deadT*3),1+u.deadT*1.5); return; }
    if(u.aggro && hero.position.distanceTo(m.position)<12){ u.target.copy(hero.position); if(hero.position.distanceTo(m.position)<1.5 && t>u.next){ u.next=t+1.6; const dmg=Math.round(rnd(3,7)); S.hp=Math.max(10,S.hp-dmg); document.getElementById('hp').style.width=S.hp+'%'; dmgText(hero.position.clone().add(new THREE.Vector3(0,2.2,0)),dmg,'hurt'); } }
    else if(t>u.next){ u.next=t+rnd(2,5); u.target.set(m.position.x+rnd(-4,4),0,m.position.z+rnd(-4,4)); if(!placeOK(u.target.x,u.target.z,0)&&roadDist(u.target.x,u.target.z)>3) u.target.set(m.position.x,0,m.position.z); }
    const dir=u.target.clone().sub(m.position); dir.y=0; const d=dir.length(), near=u.aggro?1.3:.2;
    if(d>near){ dir.normalize(); const sp=(u.fly?1.6:(u.walk||1.1))*dt; m.position.x+=dir.x*sp; m.position.z+=dir.z*sp; const ang=Math.atan2(dir.x,dir.z); let da=ang-m.rotation.y; da=Math.atan2(Math.sin(da),Math.cos(da)); m.rotation.y+=da*Math.min(1,dt*6); }
    m.position.y=groundY(m.position.x,m.position.z);
    if(u.fly){ u.body.position.y=Math.sin(t*2+u.ph)*.25; u.wings.forEach(([p,s])=>p.rotation.z=s*Math.sin(t*16+u.ph)*.7); }
    else if(u.kind==='scorpion'){ const mv=d>near; u.legs.forEach(([L,s,i])=>{ L.rotation.x=mv?Math.sin(t*14+i*2+(s>0?1.5:0))*.5:0; });
      u.tail.rotation.x=Math.sin(t*2.2+u.ph)*.12 - (u.aggro&&d<=near?Math.max(0,Math.sin(t*6))*.5:0); u.claws.forEach(([a,s])=>a.rotation.y=s*(.1+Math.sin(t*3+u.ph)*.12)); u.body.scale.setScalar(1); }
    else if(u.kind==='golem'||u.kind==='boss'){ const mv=d>near; u.legs.forEach(([L,s])=>L.rotation.x=mv?Math.sin(t*4+(s>0?Math.PI:0))*.35:0);
      u.arms.forEach(([A,s])=>A.rotation.x=mv?Math.sin(t*4+(s>0?0:Math.PI))*.3:Math.sin(t*1.2)*.05); u.body.position.y=mv?Math.abs(Math.sin(t*4))*.06:0; u.body.scale.setScalar(1); }
    else { const hop=Math.max(0,Math.sin(t*5+u.ph)); u.body.position.y=hop*.35*(d>near?1:.35); const sq=1-hop*.12; u.body.scale.set(1+(1-sq)*.8,1/sq*(hop>0.02?1:.9),1+(1-sq)*.8); }
    if(u.hurt>0){ u.hurt-=dt; u.body.scale.multiplyScalar(1+u.hurt*.4); }
    const top=u.fly?2.35:(u.tall||(u.kind==='scorpion'?1.25:1.55)); u.nm.position.copy(m.position).add(new THREE.Vector3(0,-.2,0)); u.bar.position.copy(m.position).add(new THREE.Vector3(0,top,0));
  });
  // target ring
  if(S.target&&!S.target.userData.dead){ ring.visible=true; ring.position.set(S.target.position.x,S.target.position.y+.04,S.target.position.z); ring.rotation.y+=dt*2; ring.scale.setScalar(1+Math.sin(t*6)*.06); } else ring.visible=false;
  marker.material.opacity=Math.max(0,marker.material.opacity-dt*1.5); marker.scale.addScalar(dt*.8);
  if(relic){ relic.userData.core.rotation.y+=dt*1.5; relic.userData.core.material.emissiveIntensity=1.3+Math.sin(t*3)*.5; }
  // water ripples
  ripples.forEach(r=>{ r.userData.t+=dt; const k=(r.userData.t%3)/3; r.scale.setScalar(1+k*4); r.material.opacity=.45*(1-k); if(k<dt) r.position.set(POND.x+rnd(-4,4),-0.38,POND.z+rnd(-4,4)); });
  water.material.color.setHSL(DESERT?.5:.56,.72,.5+Math.sin(t*.8)*.02);
  // particles
  for(let i=fx.length-1;i>=0;i--){ const s=fx[i], u=s.userData; u.life-=dt; u.v.y-=6*dt; s.position.addScaledVector(u.v,dt); s.material.opacity=Math.max(0,u.life*1.4); if(u.life<=0){ scene.remove(s); s.geometry.dispose(); fx.splice(i,1); } }
  const mt=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler();
  petalData.forEach((p,i)=>{ p.y-=dt*(DESERT?.25:.55)*p.s; p.x+=Math.sin(t*.9+i)*dt*.6+dt*(DESERT?2.4:.4); p.r+=dt*2; if(p.y<0){ p.y=rnd(7,11); p.x=hero.position.x+rnd(-22,22); p.z=hero.position.z+rnd(-18,18); }
    e.set(p.r,p.r*.7,0); q.setFromEuler(e); mt.compose(new THREE.Vector3(p.x,p.y,p.z),q,new THREE.Vector3(1,1,1)); petals.setMatrixAt(i,mt); }); petals.instanceMatrix.needsUpdate=true;
  // DPS meter
  const now=performance.now(); while(S.dmgLog.length&&now-S.dmgLog[0][0]>5000) S.dmgLog.shift();
  const dpsEl=document.getElementById('dps'); if(S.dmgLog.length){ dpsEl.style.opacity=1; dpsEl.textContent='ดาเมจต่อวินาที: '+Math.round(S.dmgLog.reduce((a,d)=>a+d[1],0)/Math.max(1,(now-S.dmgLog[0][0])/1000)); } else dpsEl.style.opacity=0;
  hintEl.style.display=(!S.auto&&!hintOff)?'flex':'none';
  const al=document.getElementById('auto'); al.classList.toggle('on',S.auto); al.textContent=S.auto?'ออโต้กำลังทำงาน'+'.'.repeat(1+Math.floor(t*2.5)%3):'คลิกพื้นเพื่อเดิน · คลิกมอนสเตอร์เพื่อโจมตี';
  if(!S.target && S.hp<100) { S.hp=Math.min(100,S.hp+dt*2); document.getElementById('hp').style.width=S.hp+'%'; }
  // fade trees that block the view of the hero
  occluders.forEach(o=>{ const dz=o.position.z-hero.position.z, dx=Math.abs(o.position.x-hero.position.x); const hide=dz>0.3&&dz<10&&dx<(o.userData.occ?4.6:3.2); const a=hide?.3:1;
    if(o.userData.a===undefined) o.userData.a=1; if(Math.abs(o.userData.a-a)>.01){ o.userData.a+= (a-o.userData.a)*Math.min(1,dt*8); o.traverse(m=>{ if(m.isMesh&&m.material!==outlineMat){ m.material.transparent=o.userData.a<.99; m.material.opacity=o.userData.a; m.castShadow=o.userData.a>.5; } }); } });
  // camera follow (RO-style high angle)
  const off=new THREE.Vector3(0,9.2,10.5).multiplyScalar(zoom);
  camPos.copy(hero.position).add(off); camera.position.lerp(camPos,1-Math.pow(.001,dt)); look.lerp(hero.position.clone().add(new THREE.Vector3(0,.8,0)),1-Math.pow(.001,dt)); camera.lookAt(look);
  sun.position.copy(hero.position).add(new THREE.Vector3(-14,26,10)); sun.target.position.copy(hero.position);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
camera.position.copy(hero.position).add(new THREE.Vector3(0,9.2,10.5)); look.copy(hero.position);
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false); });
requestAnimationFrame(frame);
setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0; setTimeout(()=>l.remove(),650); },400);
</script>
